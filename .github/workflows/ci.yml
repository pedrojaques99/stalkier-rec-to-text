name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o job só precisa ler o código. Sem isto o token do workflow
# nasce com escrita no repositório, que é o que uma dependência comprometida
# usa pra empurrar commit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respeita o lockfile: build reproduzível, e nenhuma versão nova
      # entra sem passar por um commit que dá pra revisar.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vulnerabilidade alta ou crítica reprova. Moderada não trava o CI: em app
      # Electron a maioria é de dependência de build que nunca roda na máquina
      # do usuário, e um portão que grita sempre é um portão que ninguém lê.
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Varre o histórico inteiro. Chave que vaza num commit continua vazada
      # depois do commit que a remove — quem precisa saber é quem revisa o PR.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
