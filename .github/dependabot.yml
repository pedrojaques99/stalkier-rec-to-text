version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Um PR por grupo em vez de um por pacote: quinze PRs de patch por semana
      # não são revisados, são fechados em lote — e aí o de segurança vai junto.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
