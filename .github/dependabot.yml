version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Um PR por grupo em vez de um por pacote: quinze PRs de patch por semana
      # não são revisados, são fechados em lote — e aí o de segurança vai junto.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    # Major destes ANDA EM CONJUNTO e não cabe em PR automático: plugin-react 6
    # exige vite 8, que o electron-vite 5 ainda não aceita; react-dom 19 exige
    # react 19. Um PR por pacote nasce vermelho, e um CI que vive vermelho para
    # de ser lido. Major aqui é decisão humana, com os quatro subindo juntos.
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      - dependency-name: electron-vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # TypeScript major muda como o código INTEIRO é checado, e um typecheck
      # verde é exatamente o que ele seria se passasse a checar menos.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Electron major troca o Node e o Chromium embutidos: pede teste manual do
      # atalho global, do loopback do Windows e da pílula antes de entrar.
      - dependency-name: electron
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
